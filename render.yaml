# Render Blueprint — PlacePulse AI (Free Tier)
# https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New → Blueprint → connect this repo.
# After deploy, manually set APP_KEY, APP_URL, OPENAI_API_KEY, and UPSTASH_REDIS_URL
# in the Render web service environment dashboard.
#
# SQLite lives on a persistent disk at /var/data so it survives redeploys.
# Upstash Redis (Free) is used for cache + sessions — no paid add-ons needed.

services:
  - type: web
    name: placepulse-ai
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /up

    # Persistent disk keeps SQLite alive across deploys & restarts
    disk:
      name: placepulse-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      # ── App ────────────────────────────────────────────────────────────────
      - key: APP_NAME
        value: PlacePulse AI
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false          # Set manually in Render dashboard after first deploy
      - key: APP_URL
        sync: false          # Set manually: https://your-app.onrender.com

      # ── Logging ────────────────────────────────────────────────────────────
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

      # ── Database (SQLite on persistent disk) ───────────────────────────────
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: database/database.sqlite

      # ── Sessions & Cache (Upstash Redis) ───────────────────────────────────
      - key: SESSION_DRIVER
        value: redis
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: redis

      # ── Redis / Upstash ────────────────────────────────────────────────────
      # UPSTASH_REDIS_URL is the canonical source; we copy it to REDIS_URL
      # so Laravel's predis client can consume it directly.
      # Format: rediss://default:<PASSWORD>@<HOST>.upstash.io:6379
      - key: UPSTASH_REDIS_URL
        sync: false          # Set manually in Render dashboard
      - key: REDIS_URL
        sync: false          # Set to same value as UPSTASH_REDIS_URL
      - key: REDIS_CLIENT
        value: predis

      # ── Queue ──────────────────────────────────────────────────────────────
      - key: QUEUE_CONNECTION
        value: sync

      # ── OpenAI ─────────────────────────────────────────────────────────────
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_MAX_COMPLETION_TOKENS
        value: "8000"
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: OPENAI_REQUEST_TIMEOUT
        value: "120"
